<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3f0"><title>أذكارنا معًا ♡</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5f3;color:#544149;font-family:system-ui,Tahoma}main{max-width:480px;margin:auto;padding:26px 17px 95px}header{text-align:center;padding:15px 0 27px}h1{font-size:30px;margin:8px}small,p{color:#82757a}section{background:white;border:1px solid #efe0e2;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 22px #a87a8220}h2{font-size:20px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{padding:14px}.symbol{font-size:29px}.num{font-weight:800;font-size:20px;direction:ltr}.bar{height:8px;background:#f3e9eb;border-radius:30px;overflow:hidden;margin:8px 0 18px}.fill{height:100%;background:#bf8899}.person:last-child .fill{background:#8ba99e}button{font:inherit;border:0;border-radius:14px;padding:14px;background:#b77b8d;color:white;font-weight:700;cursor:pointer}button:disabled{background:#a8aaac}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}#welcome{position:fixed;inset:0;background:#faf5f3;display:grid;place-items:center;z-index:9;padding:20px}#welcome section{width:min(100%,400px);text-align:center}#welcome button{font-size:32px;background:#fff0f3;color:#65434c;border:1px solid #eacbd5;width:100%}#welcome .buttons{margin-top:25px}.hide{display:none!important}.item p{font-size:21px;line-height:2;color:#45393c}.counter{display:flex;align-items:center;justify-content:space-between;background:#fcf4f6;padding:9px;border-radius:14px}#bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:12px;display:flex;justify-content:center;gap:10px}#bottom button{font-size:13px;padding:11px}#notice{text-align:center;font-size:12px}button:focus-visible{outline:3px solid #645184}</style><div id="welcome"><section><div style="font-size:32px">♡</div><h1>أذكارنا معًا</h1><p>من أنت اليوم؟</p><div class="buttons"><button aria-label="الوردة" onclick="enter('a')">🌷</button><button aria-label="القمر" onclick="enter('b')">🌙</button></div></section></div><main><header><div>♡ أذكارنا معًا ♡</div><h1>رفقة إلى الطمأنينة</h1><small>ألا بذكر الله تطمئن القلوب</small></header><div id="home"><h2>إنجازنا اليوم ♡</h2><div class="people"><section class="person" id="pa"></section><section class="person" id="pb"></section></div><section><h2>أذكاري</h2><div class="buttons"><button onclick="openList('morning')">☀️ الصباح</button><button onclick="openList('evening')">🌙 المساء</button></div></section><p id="notice">يبدأ اليوم الجديد الساعة ٦ صباحًا بتوقيت قطر. يُحفظ التقدم على هذا الهاتف حتى السادسة صباحًا بتوقيت قطر، ولا تتزامن البيانات بين الهاتفين بعد.</p></div><div id="list" class="hide"><button onclick="home()">← الرئيسية</button><h2 id="heading"></h2><section id="progress"></section><div id="items"></div></div></main><div id="bottom"><button onclick="home()">♡ الرئيسية</button><button onclick="openList('morning')">☀ الصباح</button><button onclick="openList('evening')">☾ المساء</button><button onclick="document.getElementById('welcome').classList.remove('hide')">⇄</button></div><script>
const base=[
['آية الكرسي','اقرأ آية الكرسي كاملة من سورة البقرة (255).',1],
['سورة الإخلاص','قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',3],
['سورة الفلق','قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',3],
['سورة الناس','قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',3],
['سيد الاستغفار','اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت.',1],
['بسم الله الذي لا يضر','بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.',3],
['رضيت بالله ربًا','رضيت بالله ربًا وبالإسلام دينًا وبمحمد صلى الله عليه وسلم نبيًا.',3],
['سبحان الله وبحمده','سبحان الله وبحمده.',100]
];
const data={morning:[...base.slice(0,4),['اللهم بك أصبحنا','اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.',1],...base.slice(4)],evening:[...base.slice(0,4),['اللهم بك أمسينا','اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير.',1],...base.slice(4,7),['أعوذ بكلمات الله التامات','أعوذ بكلمات الله التامات من شر ما خلق.',3]]};
let who=sessionStorage.getItem('azkar-who'),period='',day='';
function dateKey(){const x=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Qatar',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p=>[p.type,p.value]));let d=new Date(Date.UTC(+x.year,+x.month-1,+x.day));if(+x.hour<6)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function store(){try{const all=JSON.parse(localStorage.getItem('azkar-record')||'{}');const today=dateKey();const current=all[today]||{};if(Object.keys(all).some(k=>k!==today)){localStorage.setItem('azkar-record',JSON.stringify({[today]:current}));}return {[today]:current}}catch{return {}}}
function values(w,p){const s=store();return s[day]?.[w]?.[p]||{}}
function completed(w,p){const v=values(w,p);return data[p].filter((x,i)=>(+v[i]||0)>=x[2]).length}
function enter(w){who=w;sessionStorage.setItem('azkar-who',w);document.getElementById('welcome').classList.add('hide');home()}
function redraw(){day=dateKey();for(const w of ['a','b']){document.getElementById('p'+w).innerHTML='<div class="symbol">'+(w==='a'?'🌷':'🌙')+'</div>'+['morning','evening'].map(p=>'<p>'+(p==='morning'?'الصباح':'المساء')+'</p><div class="num">'+completed(w,p)+' / '+data[p].length+'</div><div class="bar"><div class="fill" style="width:'+(100*completed(w,p)/data[p].length)+'%"></div></div>').join('')}if(period)renderList()}
function home(){period='';document.getElementById('home').classList.remove('hide');document.getElementById('list').classList.add('hide');redraw();scrollTo(0,0)}
function openList(p){if(!who){document.getElementById('welcome').classList.remove('hide');return}period=p;document.getElementById('home').classList.add('hide');document.getElementById('list').classList.remove('hide');redraw();scrollTo(0,0)}
function renderList(){document.getElementById('heading').textContent=period==='morning'?'☀️ أذكار الصباح':'🌙 أذكار المساء';document.getElementById('progress').textContent='أتممت '+completed(who,period)+' من أصل '+data[period].length;const v=values(who,period);document.getElementById('items').innerHTML=data[period].map(([name,txt,max],i)=>'<section class="item"><strong>'+(i+1)+'. '+name+'</strong><p>'+txt+'</p><div class="counter"><b>'+Math.min(max,+v[i]||0)+' / '+max+'</b><button '+((+v[i]||0)>=max?'disabled':'')+' onclick="increment('+i+')">'+((+v[i]||0)>=max?'تم ✓':'أتممت تكرارًا +')+'</button></div></section>').join('')}
function increment(i){day=dateKey();const all=store();all[day]??={};all[day][who]??={morning:{},evening:{}};const v=all[day][who][period];v[i]=Math.min(data[period][i][2],(+v[i]||0)+1);localStorage.setItem('azkar-record',JSON.stringify(all));redraw()}
if(who)document.getElementById('welcome').classList.add('hide');home();setInterval(redraw,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)redraw()});window.addEventListener('storage',e=>{if(e.key==='azkar-record')redraw()});
</script></html>
