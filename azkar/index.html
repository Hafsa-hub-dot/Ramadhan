<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3f0"><title>أذكارنا معًا ♡</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5f3;color:#544149;font-family:system-ui,Tahoma}main{max-width:480px;margin:auto;padding:26px 17px 95px}header{text-align:center;padding:15px 0 27px}h1{font-size:30px;margin:8px}small,p{color:#82757a}section{background:white;border:1px solid #efe0e2;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 22px #a87a8220}h2{font-size:20px}.people{display:grid;grid-template-columns:1fr 1fr;gap:10px}.person{padding:14px}.symbol{font-size:29px}.num{font-weight:800;font-size:20px;direction:ltr}.bar{height:8px;background:#f3e9eb;border-radius:30px;overflow:hidden;margin:8px 0 18px}.fill{height:100%;background:#bf8899}.person:last-child .fill{background:#8ba99e}button{font:inherit;border:0;border-radius:14px;padding:14px;background:#b77b8d;color:white;font-weight:700;cursor:pointer}button:disabled{background:#a8aaac}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}#welcome{position:fixed;inset:0;background:#faf5f3;display:grid;place-items:center;z-index:9;padding:20px}#welcome section{width:min(100%,400px);text-align:center}#welcome button{font-size:32px;background:#fff0f3;color:#65434c;border:1px solid #eacbd5;width:100%}#welcome .buttons{margin-top:25px}.hide{display:none!important}.item p{font-size:21px;line-height:2;color:#45393c}.counter{display:flex;align-items:center;justify-content:space-between;background:#fcf4f6;padding:9px;border-radius:14px}#bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:12px;display:flex;justify-content:center;gap:10px}#bottom button{font-size:13px;padding:11px}#notice{text-align:center;font-size:12px}button:focus-visible{outline:3px solid #645184}</style><div id="welcome"><section><div style="font-size:32px">♡</div><h1>أذكارنا معًا</h1><p>من أنت اليوم؟</p><p style="font-size:13px">اختارا صورتكما فقط ♡</p><p id="loginerror" style="color:#a22;font-size:13px"></p><div class="buttons"><button aria-label="الوردة" onclick="enter('a')">🌷</button><button aria-label="القمر" onclick="enter('b')">🌙</button></div></section></div><main><header><div>♡ أذكارنا معًا ♡</div><h1>رفقة إلى الطمأنينة</h1><small>ألا بذكر الله تطمئن القلوب</small></header><div id="home"><h2>إنجازنا اليوم ♡</h2><div class="people"><section class="person" id="pa"></section><section class="person" id="pb"></section></div><section><h2>أذكاري</h2><div class="buttons"><button onclick="openList('morning')">☀️ الصباح</button><button onclick="openList('evening')">🌙 المساء</button></div></section><p id="notice">يبدأ اليوم الجديد الساعة ٦ صباحًا بتوقيت قطر. يُحفظ الإنجاز تلقائيًا في قاعدة بيانات مشتركة حتى السادسة صباحًا بتوقيت قطر، وتظهر التحديثات على الهاتفين.</p></div><div id="partner" class="hide"><button onclick="home()">← الرئيسية</button><h2 id="partnerTitle"></h2><div id="partnerItems"></div></div><div id="list" class="hide"><button onclick="home()">← الرئيسية</button><h2 id="heading"></h2><section id="progress"></section><div id="items"></div></div></main><div id="bottom"><button onclick="home()">♡ الرئيسية</button><button onclick="openList('morning')">☀ الصباح</button><button onclick="openList('evening')">☾ المساء</button><button onclick="switchAccount()">⇄</button></div><script>
const base=[
['آية الكرسي','اقرأ آية الكرسي كاملة من سورة البقرة (255).',1],
['سورة الإخلاص','قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ',3],
['سورة الفلق','قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ',3],
['سورة الناس','قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ',3],
['سيد الاستغفار','اللهم أنت ربي لا إله إلا أنت خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء بذنبي فاغفر لي فإنه لا يغفر الذنوب إلا أنت.',1],
['بسم الله الذي لا يضر','بسم الله الذي لا يضر مع اسمه شيء في الأرض ولا في السماء وهو السميع العليم.',3],
['رضيت بالله ربًا','رضيت بالله ربًا وبالإسلام دينًا وبمحمد صلى الله عليه وسلم نبيًا.',3],
['سبحان الله وبحمده','سبحان الله وبحمده.',100]
];
const data={morning:[...base.slice(0,4),['اللهم بك أصبحنا','اللهم بك أصبحنا وبك أمسينا وبك نحيا وبك نموت وإليك النشور.',1],...base.slice(4)],evening:[...base.slice(0,4),['اللهم بك أمسينا','اللهم بك أمسينا وبك أصبحنا وبك نحيا وبك نموت وإليك المصير.',1],...base.slice(4,7),['أعوذ بكلمات الله التامات','أعوذ بكلمات الله التامات من شر ما خلق.',3]]};
let who=localStorage.getItem('azkar-who'),period='',day='',token=localStorage.getItem('azkar-access')||'',remoteRecords={},busy=false;let sharedInvite=null;let detailsFor=null;const endpoint='https://lrhkvbbmvtukffwdvair.supabase.co/functions/v1/azkar-sync';
function dateKey(){const x=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Qatar',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).map(p=>[p.type,p.value]));let d=new Date(Date.UTC(+x.year,+x.month-1,+x.day));if(+x.hour<6)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function store(){return remoteRecords}
function values(w,p){const s=store();return s[day]?.[w]?.[p]||{}}
function completed(w,p){const v=values(w,p);return data[p].filter((x,i)=>(+v[i]||0)>=x[2]).length}
async function request(action,extra={},access=token){const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,token:access,...extra}),signal:controller.signal,cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'connection');return data}finally{clearTimeout(timeout)}}
function accept(data){day=data.date;const today={a:{morning:{},evening:{}},b:{morning:{},evening:{}}};for(const item of data.items){if(today[item.member_id]?.[item.period]&&Number.isInteger(item.item_index))today[item.member_id][item.period][item.item_index]=item.done_count}remoteRecords={[day]:today};redraw()}
async function enter(w){const candidate=sharedInvite?sharedInvite[w]:(w===who?token:'');const error=document.getElementById('loginerror');error.textContent='جارٍ الاتصال...';try{const result=await request('sync',{},candidate);if(result.member!==w)throw new Error('wrong_profile');token=candidate;who=w;localStorage.setItem('azkar-access',token);localStorage.setItem('azkar-who',w);document.getElementById('welcome').classList.add('hide');error.textContent='';accept(result);home()}catch(e){error.textContent=e.message==='wrong_profile'?'هذا الرمز يخص الرمز الآخر':e.message==='invalid_code'?'افتحا الرابط المشترك من جديد':'تعذر الاتصال، تحققي من الإنترنت ثم حاولي مجددًا'}} 
async function sync(){if(!token||!who||busy)return;try{const result=await request('sync');if(result.member!==who)throw Error('login');accept(result);document.getElementById('notice').textContent='♡ متصلان — المزامنة نشطة، ويبدأ يوم جديد الساعة ٦ صباحًا بتوقيت قطر'}catch(e){document.getElementById('notice').textContent='تعذر التحديث الآن — تحقق من الاتصال بالإنترنت'}}
function redraw(){day=dateKey();for(const w of ['a','b']){document.getElementById('p'+w).innerHTML='<div onclick="showPerson(\''+w+'\')" role="button" tabindex="0" style="cursor:pointer" aria-label="عرض تفاصيل الأذكار"><div class="symbol">'+(w==='a'?'🌷':'🌙')+'</div>'+['morning','evening'].map(p=>'<p>'+(p==='morning'?'الصباح':'المساء')+'</p><div class="num">'+completed(w,p)+' / '+data[p].length+'</div><div class="bar"><div class="fill" style="width:'+(100*completed(w,p)/data[p].length)+'%"></div></div>').join('')+'</div><button style="width:100%;font-size:12px" onclick="showPerson(\''+w+'\')">عرض التفاصيل ♡</button>'}if(period)renderList();if(detailsFor&&document.getElementById('partner')&&!document.getElementById('partner').classList.contains('hide'))renderDetails(detailsFor)}
function switchAccount(){localStorage.removeItem('azkar-access');localStorage.removeItem('azkar-who');token='';who=null;remoteRecords={};document.getElementById('welcome').classList.remove('hide')}
function home(){detailsFor=null;period='';document.getElementById('home').classList.remove('hide');document.getElementById('list').classList.add('hide');document.getElementById('partner').classList.add('hide');redraw();scrollTo(0,0)}
function showPerson(w){detailsFor=w;period='';document.getElementById('home').classList.add('hide');document.getElementById('list').classList.add('hide');document.getElementById('partner').classList.remove('hide');renderDetails(w);scrollTo(0,0)}function renderDetails(w){document.getElementById('partnerTitle').textContent=(w==='a'?'🌷':'🌙')+' تفاصيل الأذكار';document.getElementById('partnerItems').innerHTML=['morning','evening'].map(p=>'<section><h2>'+(p==='morning'?'☀ أذكار الصباح':'☾ أذكار المساء')+'</h2>'+data[p].map(([name,txt,max],i)=>{const n=+values(w,p)[i]||0;return '<div style="padding:12px 0;border-bottom:1px solid #eee"><div>'+name+'</div><small>'+(n>=max?'✓ مكتمل':n+' من '+max)+'</small></div>'}).join('')+'</section>').join('')}function openList(p){if(!who){document.getElementById('welcome').classList.remove('hide');return}period=p;document.getElementById('home').classList.add('hide');document.getElementById('partner').classList.add('hide');document.getElementById('list').classList.remove('hide');redraw();scrollTo(0,0)}
function renderList(){document.getElementById('heading').textContent=period==='morning'?'☀️ أذكار الصباح':'🌙 أذكار المساء';document.getElementById('progress').textContent='أتممت '+completed(who,period)+' من أصل '+data[period].length;const v=values(who,period);document.getElementById('items').innerHTML=data[period].map(([name,txt,max],i)=>'<section class="item"><strong>'+(i+1)+'. '+name+'</strong><p>'+txt+'</p><div class="counter"><b>'+Math.min(max,+v[i]||0)+' / '+max+'</b><button '+((+v[i]||0)>=max?'disabled':'')+' onclick="increment('+i+')">'+((+v[i]||0)>=max?'تم ✓':'أتممت تكرارًا +')+'</button></div></section>').join('')}
async function increment(i){if(busy)return;busy=true;const button=document.activeElement;if(button instanceof HTMLButtonElement)button.disabled=true;try{const result=await request('add',{period,index:i,max:data[period][i][2]});accept(result)}catch(e){alert('لم يُحفظ الذكر. تحققي من اتصال الإنترنت ثم أعيدي المحاولة.')}finally{busy=false;redraw()}}
if(/^#join=[A-Za-z0-9_-]{20,60}\.[A-Za-z0-9_-]{20,60}$/.test(location.hash)){const parts=location.hash.substring(6).split('.');sharedInvite={a:parts[0],b:parts[1]};localStorage.removeItem('azkar-access');localStorage.removeItem('azkar-who');who=null;token='';history.replaceState(null,'',location.pathname+location.search)}if(who&&token)document.getElementById('welcome').classList.add('hide');else document.getElementById('welcome').classList.remove('hide');home();if(who&&token)sync();if(/^#(a|b)=[A-Za-z0-9_-]{20,60}$/.test(location.hash)){const parts=location.hash.slice(1).split('=');sharedInvite={[parts[0]]:parts[1]};history.replaceState(null,'',location.pathname+location.search);enter(parts[0]);}setInterval(()=>{if(!document.hidden)sync()},5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});window.addEventListener('storage',e=>{if(e.key==='azkar-access'||e.key==='azkar-who')location.reload()});
</script></html>
